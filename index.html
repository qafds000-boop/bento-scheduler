<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 便當排班系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f6f2ec;--card:#fff;--card2:#f0ebe0;--card3:#e8e0d0;
  --border:#ddd5c0;--text:#1e1810;--muted:#7a6a54;--hint:#c0b098;
  --red:#c8380a;--red-l:#fff2ee;--red-b:#f5c4a8;
  --amber:#c87000;--amber-l:#fff8ee;
  --green:#1e6e30;--green-l:#eef8f0;
  --blue:#0a4a8a;--blue-l:#eef4ff;--blue-b:#aac8f0;
  --purple:#5a2a8a;
  --sh:0 1px 6px rgba(30,24,16,.08);
  --sh2:0 4px 20px rgba(30,24,16,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* ─ Header ─ */
header{background:var(--text);color:#f6f2ec;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25);}
header .logo{font-size:22px;}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em;}
header small{font-size:11px;color:#a09070;margin-left:2px;}
header .sp{flex:1;}
.hbtn{padding:6px 14px;background:rgba(255,255,255,.12);color:#f6f2ec;border:1px solid rgba(255,255,255,.2);border-radius:7px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;}
.hbtn:hover{background:rgba(255,255,255,.22);}

/* ─ Layout ─ */
.app{display:flex;min-height:calc(100vh - 52px);}

/* ─ Sidebar ─ */
.sb{width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:16px 14px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px;}
.sb-sec{margin-bottom:20px;}
.sb-ttl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* Stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.sc{background:var(--card2);border-radius:8px;padding:9px;text-align:center;}
.sn{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--red);}
.sl{font-size:10px;color:var(--muted);margin-top:1px;}

/* Balance */
.bb{display:flex;flex-direction:column;gap:5px;}
.br{display:flex;align-items:center;gap:6px;}
.bn{font-size:11px;width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bt{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bf{height:100%;border-radius:3px;transition:width .4s;}
.bp{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:26px;text-align:right;}

/* Vendor list */
.vi{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;margin-bottom:4px;background:var(--card2);border:1.5px solid transparent;transition:.15s;}
.vi:hover{border-color:var(--amber);background:var(--amber-l);}
.vd{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.vn{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vc{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);background:var(--card);padding:1px 6px;border-radius:20px;border:1px solid var(--border);white-space:nowrap;}
.vbs{display:flex;gap:2px;}
.ico{width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s;background:transparent;color:var(--muted);}
.ico:hover{background:var(--border);color:var(--text);}
.ico.del:hover{background:#ffe0e0;color:var(--red);}
.ico.edit:hover{background:var(--amber-l);color:var(--amber);}
.ico.ok{color:var(--green);}
.ico.ok:hover{background:var(--green-l);color:var(--green);}
.vi.editing{border-color:var(--amber) !important;background:var(--amber-l) !important;}
.vname-inp{flex:1;min-width:0;padding:2px 6px;border:1.5px solid var(--amber);border-radius:5px;font-family:inherit;font-size:12px;font-weight:500;background:#fff;color:var(--text);}
.vname-inp:focus{outline:none;}
.af{display:flex;gap:6px;margin-top:6px;}
.inp{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;background:var(--card2);color:var(--text);transition:.15s;}
.inp:focus{outline:none;border-color:var(--red);}
.badd{padding:6px 12px;background:var(--red);color:#fff;border:none;border-radius:7px;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;}
.badd:hover{background:#a02c08;}

/* Sidebar btns */
.sbbtn{display:block;width:100%;padding:9px;text-align:center;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;margin-bottom:6px;border:1.5px solid var(--border);}
.sbbtn.auto{background:var(--red);color:#fff;border-color:var(--red);font-size:13px;}
.sbbtn.auto:hover{background:#a02c08;}
.sbbtn.sch{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b);}
.sbbtn.sch:hover{background:#d8eaff;}
.sbbtn.vhol{background:var(--amber-l);color:var(--amber);border-color:#e8c070;}
.sbbtn.vhol:hover{background:#fff0d0;}
.sbbtn.exp{background:var(--green-l);color:var(--green);border-color:#8ec0a0;}
.sbbtn.exp:hover{background:#d8f0e0;}
.sbbtn.clr{background:var(--card);color:var(--muted);}
.sbbtn.clr:hover{color:var(--red);border-color:var(--red-b);}

/* ─ Main ─ */
.main{flex:1;padding:20px 24px;}
.ctrl{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.mnav{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:4px 12px;}
.mnav button{background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:0 2px;transition:.15s;}
.mnav button:hover{color:var(--red);}
.mlbl{font-size:15px;font-weight:700;min-width:90px;text-align:center;}

/* Legend chips */
.leg{display:flex;gap:6px;flex-wrap:wrap;}
.legchip{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.legchip.sch{background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);}
.legchip.we{background:#fff4f0;color:#c06040;border:1px solid #fcc0a0;}

/* Calendar */
.ch{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.cwd{text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:5px 0;}
.cwd.we{color:#c06040;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}

.cd{background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:7px 6px 6px;min-height:82px;transition:.15s;cursor:pointer;position:relative;overflow:hidden;}
.cd:hover:not(.emp):not(.soff){border-color:var(--amber);box-shadow:var(--sh);}
.cd.emp{background:transparent;border-color:transparent;cursor:default;}
.cd.we{background:#fdf6f0;}
.cd.we .dn{color:#c06040;}
.cd.tod{border-color:var(--red);}
.cd.tod .dn{color:var(--red);font-weight:700;}
.cd.soff{background:var(--blue-l);border-color:var(--blue-b);cursor:pointer;}
.cd.soff:hover{background:#d8eaff;}

.dn{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:3px;}
.dn .smk{font-size:9px;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);border-radius:20px;padding:0 5px;font-family:'Noto Sans TC',sans-serif;font-weight:500;}
.dv{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;}
.dhint{font-size:9px;color:var(--hint);text-align:center;margin-top:8px;}
.soff-lbl{font-size:10px;font-weight:700;color:var(--blue);display:block;margin-top:3px;}
.vhtags{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.vhtag{font-size:9px;padding:1px 4px;border-radius:3px;display:flex;align-items:center;gap:2px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vhdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* ─ Overlays & Modals ─ */
.ov{position:fixed;inset:0;background:rgba(30,24,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
.ov.on{opacity:1;pointer-events:all;}
.mo{background:var(--card);border-radius:16px;padding:22px;width:390px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:var(--sh2);transform:translateY(8px);transition:transform .2s;}
.ov.on .mo{transform:translateY(0);}
.hmo{background:var(--card);border-radius:16px;padding:22px;width:560px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);transform:translateY(8px);transition:transform .2s;}
.ov.on .hmo{transform:translateY(0);}
.mo h3,.hmo h3{font-size:16px;margin-bottom:3px;}
.dlbl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:14px;}
.sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.mact{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}

/* Vendor picker */
.vp{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;}
.vpb{padding:9px 12px;border:2px solid var(--border);border-radius:9px;background:var(--card2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;transition:.15s;font-family:inherit;width:100%;}
.vpb:hover:not(.vh){border-color:var(--amber);background:var(--amber-l);}
.vpb.act{border-color:var(--red);background:var(--red-l);}
.vpb.vh{opacity:.35;cursor:not-allowed;}
.vpn{font-size:12px;font-weight:600;}
.vpm{font-size:10px;color:var(--muted);margin-top:1px;}
.hbadge{font-size:10px;color:#a02020;background:#fff0f0;border:1px solid #f5c0c0;border-radius:20px;padding:0 6px;margin-left:4px;}

/* Buttons */
.bghost{padding:7px 14px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bghost:hover{color:var(--text);border-color:var(--text);}
.bdanger{padding:7px 14px;background:#fff0f0;color:var(--red);border:1.5px solid var(--red-b);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bdanger:hover{background:#ffe0e0;}
.bok{padding:7px 16px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bok:hover{background:#a02c08;}
.bblue{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bblue:hover{background:#083a6e;}

/* ─ Mini calendar (holiday picker) ─ */
.mcwrap{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.mchead{background:var(--card2);padding:9px 13px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--border);}
.mchead .mcht{font-size:13px;font-weight:700;flex:1;}
.mchips{display:flex;flex-wrap:wrap;gap:4px;}
.mchip{font-size:10px;padding:1px 8px;border-radius:20px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;display:flex;align-items:center;gap:3px;}
.mchip button{background:none;border:none;color:#a02020;cursor:pointer;font-size:12px;line-height:1;padding:0;}
.mcb{padding:9px 13px;}
.mchd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
.mcwd{text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding:2px 0;}
.mcwd.we{color:#c06040;}
.mcgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mcd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;cursor:pointer;border:1.5px solid transparent;transition:.12s;font-family:'DM Mono',monospace;font-weight:500;user-select:none;}
.mcd:hover:not(.mce){background:var(--amber-l);border-color:var(--amber);}
.mcd.mce{cursor:default;visibility:hidden;}
.mcd.mcwe{color:#c06040;}
.mcd.mcoff{background:#fff0f0!important;border-color:#f08060!important;color:var(--red)!important;font-weight:700;}
.mcd.mcsoff{background:var(--blue-l)!important;border-color:var(--blue-b)!important;color:var(--blue)!important;font-weight:700;}
.mcd.mcdim{color:var(--hint);cursor:default;}
.mcd.mcdim:hover{background:transparent;border-color:transparent;}

/* Vendor hol section */
.vhsec{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.vhhead{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--card2);border-bottom:1.5px solid var(--border);cursor:pointer;user-select:none;}
.vhhead:hover{background:var(--card3);}
.vhhead .vhhn{font-size:13px;font-weight:700;flex:1;}
.vhcnt{font-size:10px;padding:1px 8px;border-radius:20px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;}
.vharrow{color:var(--muted);font-size:12px;transition:transform .2s;}
.vharrow.open{transform:rotate(180deg);}
.vhbody{padding:10px 13px;display:none;}
.vhbody.open{display:block;}

/* Chips row for vendor holidays display */
.vhchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}

/* Pending selection highlight */
.mcd.mcpend{background:#fff8e0!important;border-color:var(--amber)!important;color:var(--amber)!important;font-weight:700;}
.mcd.mcpend-off{background:#fff0f0!important;border-color:#f08060!important;color:var(--red)!important;font-weight:700;}
.vhol-note{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.vhol-pending-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 10px;background:var(--amber-l);border:1.5px solid #e8c070;border-radius:8px;}
.vhol-pending-bar span{font-size:12px;color:var(--amber);font-weight:500;}
.bsave{padding:5px 14px;background:var(--amber);color:#fff;border:none;border-radius:7px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bsave:hover{background:#a05800;}
.bcancel-sm{padding:5px 10px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bcancel-sm:hover{color:var(--text);border-color:var(--text);}

/* Section title */
.secttl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}

/* ─ Toast ─ */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#f6f2ec;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--sh2);transform:translateY(14px);opacity:0;transition:all .3s;z-index:400;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<header>
  <span class="logo">🍱</span>
  <div>
    <h1>便當排班系統 <small>補習班專用</small></h1>
  </div>
  <div class="sp"></div>
  <button class="hbtn" onclick="openSchoolModal()">🏫 補習班公休</button>
  <button class="hbtn" style="margin-left:6px" onclick="openVendorHolModal()">📅 廠商公休</button>
</header>

<div class="app">
  <aside class="sb">
    <div class="sb-sec">
      <div class="sb-ttl">本月統計</div>
      <div class="sg">
        <div class="sc"><div class="sn" id="stDays">0</div><div class="sl">已排天數</div></div>
        <div class="sc"><div class="sn" id="stVend">0</div><div class="sl">廠商數量</div></div>
        <div class="sc"><div class="sn" id="stSch">0</div><div class="sl">補習班公休</div></div>
        <div class="sc"><div class="sn" id="stWork">0</div><div class="sl">需訂餐天數</div></div>
      </div>
    </div>

    <div class="sb-sec">
      <div class="sb-ttl">廠商均衡度</div>
      <div class="bb" id="balBars"></div>
    </div>

    <div class="sb-sec">
      <div class="sb-ttl">便當廠商</div>
      <div id="vendorList"></div>
      <div class="af">
        <input type="text" class="inp" id="newName" placeholder="新增廠商名稱…" maxlength="10">
        <button class="badd" onclick="addVendor()">＋</button>
      </div>
    </div>

    <div class="sb-sec">
      <div class="sb-ttl">排班操作</div>
      <button class="sbbtn auto" onclick="autoSchedule()">🎲 一鍵自動排班</button>
      <button class="sbbtn sch" onclick="openSchoolModal()">🏫 補習班公休設定</button>
      <button class="sbbtn vhol" onclick="openVendorHolModal()">📅 廠商公休設定</button>
      <button class="sbbtn exp" onclick="exportSchedule()">📋 複製排班表</button>
      <button class="sbbtn clr" onclick="clearMonth()">🗑 清除本月排班</button>
    </div>
  </aside>

  <main class="main">
    <div class="ctrl">
      <div class="mnav">
        <button onclick="changeMonth(-1)">‹</button>
        <span class="mlbl" id="monthLabel"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="leg">
        <span class="legchip sch">🏫 藍色＝補習班公休（不訂餐）</span>
        <span class="legchip we">週末不自動排班</span>
      </div>
    </div>
    <div class="ch">
      <div class="cwd we">日</div>
      <div class="cwd">一</div><div class="cwd">二</div>
      <div class="cwd">三</div><div class="cwd">四</div>
      <div class="cwd">五</div>
      <div class="cwd we">六</div>
    </div>
    <div class="cg" id="calGrid"></div>
  </main>
</div>

<!-- Day Modal -->
<div class="ov" id="dayOv">
  <div class="mo">
    <h3>選擇便當廠商</h3>
    <div class="dlbl" id="dayLbl"></div>
    <div class="vp" id="vpicker"></div>
    <div class="mact">
      <button class="bdanger" onclick="clearDay()">清除這天</button>
      <button class="bghost" onclick="closeOv('dayOv')">取消</button>
    </div>
  </div>
</div>

<!-- School Holiday Modal -->
<div class="ov" id="schoolOv">
  <div class="hmo">
    <h3>🏫 補習班公休設定</h3>
    <p class="sub">點擊日期來切換公休。公休日當天不會訂餐，自動排班也會自動跳過。</p>
    <div class="mcwrap">
      <div class="mchead">
        <span class="mcht" id="sHolTitle"></span>
        <div class="mchips" id="sHolChips"></div>
      </div>
      <div class="mcb" id="sHolCal"></div>
    </div>
    <div class="mact">
      <button class="bghost" onclick="closeOv('schoolOv')">完成</button>
    </div>
  </div>
</div>

<!-- Vendor Holiday Modal -->
<div class="ov" id="vholOv">
  <div class="hmo">
    <h3>📅 廠商公休設定</h3>
    <p class="sub">為每家廠商設定本月公休日。公休日當天自動排班不會指派該廠商，手動也可避開。</p>
    <div id="vholBlocks"></div>
    <div class="mact">
      <button class="bghost" onclick="closeOv('vholOv')">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const SK = 'bentoV4';
const COLORS = ['#c8380a','#c87000','#1e6e30','#0a4a8a','#5a2a8a','#8a2a60','#1a709a','#707020','#2a7060','#7a3030'];

let S = {
  vendors:[
    {id:1,name:'香香便當',color:'#c8380a'},
    {id:2,name:'媽媽廚房',color:'#c87000'},
    {id:3,name:'大廚便當',color:'#1e6e30'},
    {id:4,name:'健康飯盒',color:'#0a4a8a'},

// ─── Persist ──────────────────────────────────────────────────────────────────
function save(){ try{ localStorage.setItem(SK,JSON.stringify(S)); }catch(e){} }
function load(){

// ─── Helpers ──────────────────────────────────────────────────────────────────
const dk = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const mdays = (y,m) => new Date(y,m+1,0).getDate();
const fwd = (y,m) => new Date(y,m,1).getDay();
const isWE = (y,m,d) => { const w=new Date(y,m,d).getDay(); return w===0||w===6; };
const isTod = (y,m,d) => { const t=new Date(); return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d; };
const isSchOff = k => !!S.schoolHols[k];
const vholsOn = k => S.vendorHols[k]||[];
const isVOff = (k,vid) => (S.vendorHols[k]||[]).includes(vid);

function getWorkdays(y,m){
  const r=[];
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(!isWE(y,m,d)&&!isSchOff(k)) r.push({d,k});
  }
  return r;
}

function getStats(y,m){
  const counts={};
  S.vendors.forEach(v=>counts[v.id]=0);
  let total=0;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(S.schedule[k]!==undefined){ counts[S.schedule[k]]=(counts[S.schedule[k]]||0)+1; total++; }
  }
  let schOff=0;
  for(let d=1;d<=mdays(y,m);d++) if(isSchOff(dk(y,m,d))) schOff++;
  return{ counts, total, schOff, workdays:getWorkdays(y,m).length };
}

// ─── Auto Schedule ────────────────────────────────────────────────────────────
function autoSchedule(){
  if(!S.vendors.length){ showToast('請先新增廠商'); return; }
  const y=S.cy, m=S.cm;
  const wdays = getWorkdays(y,m);
  if(!wdays.length){ showToast('本月沒有需訂餐的工作天'); return; }

  // Count from scratch for this month
  const counts={};
  S.vendors.forEach(v=>counts[v.id]=0);
  let lastVid=null;

  wdays.forEach(({d,k})=>{
    const avail = S.vendors.filter(v=>!isVOff(k,v.id));
    if(!avail.length) return;
    // Sort by assigned count asc, shuffle ties
    avail.sort((a,b)=>{
      const diff=counts[a.id]-counts[b.id];
      return diff!==0 ? diff : Math.random()-.5;
    });
    // Avoid consecutive same vendor if possible
    let pick=avail[0];
    if(pick.id===lastVid && avail.length>1) pick=avail[1];
    S.schedule[k]=pick.id;
    counts[pick.id]++;
    lastVid=pick.id;
  });

  save(); render();
  showToast(`✅ 已自動排班 ${wdays.length} 天（週一～五，略過公休）`);
}

function removeVendor(id){

  S.vendors=S.vendors.filter(v=>v.id!==id);
  for(const k in S.schedule) if(S.schedule[k]===id) delete S.schedule[k];
  for(const k in S.vendorHols) S.vendorHols[k]=S.vendorHols[k].filter(v=>v!==id);
  save(); render();
}

// ─── Vendor Holiday CRUD ──────────────────────────────────────────────────────
// pendingVHol: per-vendor staging area  { vendorId: Set<dateKey> }
let pendingVHol = {};

function initPendingForVendor(vid){
  // Copy current saved state into pending set
  const y=S.cy,m=S.cm;
  const set=new Set();
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(isVOff(k,vid)) set.add(k);
  }
  pendingVHol[vid]=set;
}

function togglePendingVHol(k,vid){
  if(!pendingVHol[vid]) initPendingForVendor(vid);
  if(pendingVHol[vid].has(k)) pendingVHol[vid].delete(k);
  else pendingVHol[vid].add(k);
  // Only re-render this vendor's mini-cal + count, not whole modal
  refreshVendorHolSection(vid);
}

function saveVendorHol(vid){
  if(!pendingVHol[vid]) return;
  const y=S.cy,m=S.cm;
  // Clear old data for this vendor this month, write new
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(!S.vendorHols[k]) S.vendorHols[k]=[];
    S.vendorHols[k]=S.vendorHols[k].filter(v=>v!==vid);
    if(pendingVHol[vid].has(k)) S.vendorHols[k].push(vid);
    if(S.vendorHols[k].length===0) delete S.vendorHols[k];
  }
  delete pendingVHol[vid];
  save(); render();
  refreshVendorHolSection(vid);
  showToast('✅ 已儲存公休設定');
}

function cancelVendorHol(vid){
  delete pendingVHol[vid];
  refreshVendorHolSection(vid);
}

function refreshVendorHolSection(vid){
  const v=S.vendors.find(v=>v.id===vid); if(!v) return;
  const y=S.cy,m=S.cm;
  const pending=pendingVHol[vid];
  // Count: use pending if editing, else saved
  let count=0;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(pending? pending.has(k) : isVOff(k,vid)) count++;
  }
  // Update count badge
  const cntEl=document.getElementById(`vhcnt_${vid}`);
  if(cntEl) cntEl.textContent=`${count} 天公休`;
  // Re-render mini cal
  const calDiv=document.getElementById(`vhcal_${vid}`);
  if(calDiv){
    renderMiniCal(null, y, m, k=>{ togglePendingVHol(k,vid); },
      k=>{
        const inPend = pending ? pending.has(k) : false;
        const inSaved = isVOff(k,vid);
        if(pending){
          return inPend ? 'mcpend-off' : '';
        }
        return inSaved ? 'mcoff' : '';
      },
      calDiv, isSchOff);
  }
  // Show/hide pending bar
  const bar=document.getElementById(`vhbar_${vid}`);
  if(bar){
    if(pending){
      bar.style.display='flex';
      const diff=count - (()=>{ let c=0; for(let d=1;d<=mdays(y,m);d++) if(isVOff(dk(y,m,d),vid)) c++; return c; })();
      bar.querySelector('.vhol-pending-bar span').textContent=
        `已選 ${count} 天公休${diff>0?` (+${diff})`:diff<0?` (${diff})`:''}（尚未儲存）`;
    } else {
      bar.style.display='none';
    }
  }
}

// ─── Mini Calendar builder ────────────────────────────────────────────────────
// targetId: element id OR null (use el directly)
// onClick: (key)=>void
// cellClass: (key)=>string of extra classes
// el: direct element ref (optional)
// dimFn: (key)=>bool — if true, cell is dimmed (unclickable)
function renderMiniCal(targetId, y, m, onClick, cellClass, el=null, dimFn=null){
  const wrap = el || document.getElementById(targetId);
  if(!wrap) return;
  wrap.innerHTML='';
  const hd=document.createElement('div'); hd.className='mchd';
  ['日','一','二','三','四','五','六'].forEach((w,i)=>{
    const s=document.createElement('div'); s.className='mcwd'+(i===0||i===6?' we':''); s.textContent=w;
    hd.appendChild(s);
  });
  wrap.appendChild(hd);
  const grid=document.createElement('div'); grid.className='mcgrid';
  const first=fwd(y,m), total=mdays(y,m);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='mcd mce';grid.appendChild(e);}
  for(let d=1;d<=total;d++){
    const k=dk(y,m,d);
    const we=isWE(y,m,d);
    const dim=dimFn&&dimFn(k);
    const extra=cellClass(k);
    const cell=document.createElement('div');
    cell.className='mcd'+(we?' mcwe':'')+(dim&&!extra?' mcdim':'')+(extra?' '+extra:'');
    cell.textContent=d;
    if(!dim||extra) cell.onclick=()=>onClick(k);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
}

// ─── Calendar Render ──────────────────────────────────────────────────────────
function renderCalendar(){
  const y=S.cy,m=S.cm;
  const mn=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('monthLabel').textContent=`${y} 年 ${mn[m]} 月`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  const first=fwd(y,m), total=mdays(y,m);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cd emp';grid.appendChild(e);}
  for(let d=1;d<=total;d++){
    const k=dk(y,m,d);
    const we=isWE(y,m,d);
    const soff=isSchOff(k);
    const tod=isTod(y,m,d);
    const vid=S.schedule[k];
    const vendor=vid!==undefined?S.vendors.find(v=>v.id===vid):null;
    const vhols=vholsOn(k).map(id=>S.vendors.find(v=>v.id===id)).filter(Boolean);
    const cell=document.createElement('div');
    let cls='cd'+(we?' we':'')+(soff?' soff':'')+(tod?' tod':'');
    cell.className=cls;
    // Day number
    const dn=document.createElement('div'); dn.className='dn';
    dn.textContent=d;
    if(soff){ const mk=document.createElement('span'); mk.className='smk'; mk.textContent='公休'; dn.appendChild(mk); }
    cell.appendChild(dn);
    if(soff){
      const lbl=document.createElement('span'); lbl.className='soff-lbl'; lbl.textContent='補習班公休・不訂餐';
      cell.appendChild(lbl);
    } else if(vendor){
      const dv=document.createElement('span'); dv.className='dv'; dv.style.background=vendor.color; dv.textContent=vendor.name;
      cell.appendChild(dv);
    } else if(!we){
      const h=document.createElement('div'); h.className='dhint'; h.textContent='點擊選擇';
      cell.appendChild(h);
    }
    // Vendor holiday tags
    if(vhols.length&&!soff){
      const tags=document.createElement('div'); tags.className='vhtags';
      vhols.forEach(v=>{
        const t=document.createElement('div'); t.className='vhtag';
        t.innerHTML=`<span class="vhdot" style="background:${v.color}"></span>${v.name}公休`;
        tags.appendChild(t);
      });
      cell.appendChild(tags);
    }
    cell.onclick=()=>{
      if(soff){ if(confirm('這天是補習班公休，要取消公休嗎？')){ toggleSchoolHol(k); } return; }
      openDayModal(k);
    };
    grid.appendChild(cell);
  }
}

// ─── Rename vendor (inline) ───────────────────────────────────────────────────
function startRename(id){
  const v=S.vendors.find(v=>v.id===id); if(!v) return;
  const row=document.getElementById(`vi_${id}`); if(!row) return;
  row.classList.add('editing');
  // Replace name span with input
  const nameEl=document.getElementById(`vn_${id}`);
  const inp=document.createElement('input');
  inp.type='text'; inp.className='vname-inp'; inp.value=v.name; inp.maxLength=20;
  inp.id=`vinp_${id}`;
  nameEl.replaceWith(inp);
  inp.focus(); inp.select();
  // Swap edit btn → confirm btn
  const editBtn=row.querySelector('.ico.edit');
  editBtn.textContent='✓'; editBtn.className='ico ok'; editBtn.title='確認';
  editBtn.onclick=()=>confirmRename(id);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') confirmRename(id);
    if(e.key==='Escape') cancelRename(id,v.name);
  });
}

function confirmRename(id){
  const inp=document.getElementById(`vinp_${id}`); if(!inp) return;
  const newName=inp.value.trim();
  if(!newName){ showToast('名稱不能為空'); inp.focus(); return; }
  if(S.vendors.find(v=>v.id!==id&&v.name===newName)){ showToast('名稱已存在'); inp.focus(); return; }
  const v=S.vendors.find(v=>v.id===id); if(!v) return;
  v.name=newName;
  save(); render();
  showToast(`已更新為「${newName}」`);
}

function cancelRename(id, originalName){
  render(); // just re-render to restore
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportSchedule(){
  const y=S.cy,m=S.cm;
  const wn=['日','一','二','三','四','五','六'];
  const mn=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  const lines=[`📅 ${y}年${mn[m]}月 便當排班表\n`];
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    const w=new Date(y,m,d).getDay();
    if(isSchOff(k)){ lines.push(`${m+1}/${d}（${wn[w]}）🏫 補習班公休`); continue; }
    if(isWE(y,m,d)) continue;
    if(S.schedule[k]!==undefined){
      const v=S.vendors.find(vv=>vv.id===S.schedule[k]);
      lines.push(`${m+1}/${d}（${wn[w]}）${v?v.name:'未知'}`);
    } else {
      lines.push(`${m+1}/${d}（${wn[w]}）－ 尚未排班`);
    }
  }
  const {counts}=getStats(y,m);
  lines.push('\n📊 廠商訂購統計：');
  S.vendors.forEach(v=>lines.push(`  ${v.name}：${counts[v.id]||0} 天`));
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>showToast('📋 已複製到剪貼簿！'))
    .catch(()=>showToast('複製失敗，請手動截圖'));
}

function openOv(id){ document.getElementById(id).classList.add('on'); }
function closeOv(id){
  document.getElementById(id).classList.remove('on');
  editKey=null;
  if(id==='vholOv') pendingVHol={};
}
document.querySelectorAll('.ov').forEach(ov=>{
  ov.addEventListener('click',e=>{
    if(e.target===ov){
      ov.classList.remove('on');
      if(ov.id==='vholOv') pendingVHol={};
    }
  });
});

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.getElementById('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') addVendor(); });

// ─── Boot ─────────────────────────────────────────────────────────────────────
load(); render();
