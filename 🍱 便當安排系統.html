<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 便當安排系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f6f2ec;--card:#fff;--card2:#f0ebe0;--card3:#e8e0d0;
  --border:#ddd5c0;--text:#1e1810;--muted:#7a6a54;--hint:#c0b098;
  --red:#c8380a;--red-l:#fff2ee;--red-b:#f5c4a8;
  --amber:#c87000;--amber-l:#fff8ee;
  --green:#1e6e30;--green-l:#eef8f0;
  --blue:#0a4a8a;--blue-l:#eef4ff;--blue-b:#aac8f0;
  --purple:#5a2a8a;
  --sh:0 1px 6px rgba(30,24,16,.08);
  --sh2:0 4px 20px rgba(30,24,16,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* ─ Header ─ */
header{background:var(--text);color:#f6f2ec;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25);}
header .logo{font-size:22px;}
header h1{font-size:17px;font-weight:700;letter-spacing:.04em;}
header small{font-size:11px;color:#a09070;margin-left:2px;}
header .sp{flex:1;}
.hbtn{padding:6px 14px;background:rgba(255,255,255,.12);color:#f6f2ec;border:1px solid rgba(255,255,255,.2);border-radius:7px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;}
.hbtn:hover{background:rgba(255,255,255,.22);}

/* ─ Layout ─ */
.app{display:flex;min-height:calc(100vh - 52px);}

/* ─ Sidebar ─ */
.sb{width:310px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:16px 14px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px;}
.sb-sec{margin-bottom:20px;}
.sb-ttl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* Stats */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.sc{background:var(--card2);border-radius:8px;padding:9px;text-align:center;}
.sn{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--red);}
.sl{font-size:10px;color:var(--muted);margin-top:1px;}

/* Balance */
.bb{display:flex;flex-direction:column;gap:5px;}
.br{display:flex;align-items:center;gap:6px;}
.bn{font-size:11px;width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bt{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bf{height:100%;border-radius:3px;transition:width .4s;}
.bp{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:26px;text-align:right;}

/* Vendor list */
.vi{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:8px;margin-bottom:4px;background:var(--card2);border:1.5px solid transparent;transition:.15s;}
.vi:hover{border-color:var(--amber);background:var(--amber-l);}
.vi-top{display:flex;align-items:center;gap:6px;width:100%;}
.vi-ctrl{display:flex;align-items:center;gap:5px;padding-left:16px;}
.vi-phone{display:flex;align-items:center;gap:5px;padding-left:16px;}
.vphone-link{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);text-decoration:none;letter-spacing:.02em;}
.vphone-link:hover{text-decoration:underline;}
.vphone-none{font-size:11px;color:var(--hint);font-style:italic;}
.vd{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.vn{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vc{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);background:var(--card);padding:1px 6px;border-radius:20px;border:1px solid var(--border);white-space:nowrap;}
.vbs{display:flex;gap:2px;margin-left:auto;}
.ico{width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s;background:transparent;color:var(--muted);}
.ico:hover{background:var(--border);color:var(--text);}
.ico.del:hover{background:#ffe0e0;color:var(--red);}
.ico.edit:hover{background:var(--amber-l);color:var(--amber);}
.ico.ok{color:var(--green);}
.ico.ok:hover{background:var(--green-l);color:var(--green);}
/* Edit form inside vendor row */
.vi-editform{width:100%;display:flex;flex-direction:column;gap:4px;padding:2px 0 4px 17px;}
.vi-editrow{display:flex;align-items:center;gap:5px;}
.vi-editlbl{font-size:10px;color:var(--muted);width:22px;flex-shrink:0;}
.vname-inp{flex:1;min-width:0;padding:3px 7px;border:1.5px solid var(--amber);border-radius:5px;font-family:inherit;font-size:12px;font-weight:500;background:#fff;color:var(--text);}
.vname-inp:focus{outline:none;}
.vi.editing{border-color:var(--amber) !important;background:var(--amber-l) !important;}
/* Weight stepper */
.wstepper{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.wstp{width:18px;height:18px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s;padding:0;}
.wstp:hover{background:var(--amber-l);border-color:var(--amber);color:var(--amber);}
.wval{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--text);min-width:14px;text-align:center;}
.wval.hi{color:var(--red);}
.af{display:flex;gap:6px;margin-top:6px;}
.inp{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;background:var(--card2);color:var(--text);transition:.15s;}
.inp:focus{outline:none;border-color:var(--red);}
.badd{padding:6px 12px;background:var(--red);color:#fff;border:none;border-radius:7px;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;}
.badd:hover{background:#a02c08;}

/* Sidebar btns */
.sbbtn{display:block;width:100%;padding:9px;text-align:center;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;margin-bottom:6px;border:1.5px solid var(--border);}
.sbbtn.auto{background:var(--red);color:#fff;border-color:var(--red);font-size:13px;}
.sbbtn.auto:hover{background:#a02c08;}
.sbbtn.sch{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b);}
.sbbtn.sch:hover{background:#d8eaff;}
.sbbtn.vhol{background:var(--amber-l);color:var(--amber);border-color:#e8c070;}
.sbbtn.vhol:hover{background:#fff0d0;}
.sbbtn.exp{background:var(--green-l);color:var(--green);border-color:#8ec0a0;}
.sbbtn.exp:hover{background:#d8f0e0;}
.sbbtn.clr{background:var(--card);color:var(--muted);}
.sbbtn.clr:hover{color:var(--red);border-color:var(--red-b);}

/* ─ Main ─ */
.main{flex:1;padding:20px 24px;}
.ctrl{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.mnav{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:4px 12px;}
.mnav button{background:none;border:none;cursor:pointer;font-size:17px;color:var(--muted);padding:0 2px;transition:.15s;}
.mnav button:hover{color:var(--red);}
.mlbl{font-size:15px;font-weight:700;min-width:90px;text-align:center;}

/* Legend chips */
.leg{display:flex;gap:6px;flex-wrap:wrap;}
.legchip{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.legchip.sch{background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);}
.legchip.we{background:#fff4f0;color:#c06040;border:1px solid #fcc0a0;}

/* Calendar */
.ch{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.cwd{text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:5px 0;}
.cwd.we{color:#c06040;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}

.cd{background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:7px 6px 6px;min-height:82px;transition:.15s;cursor:pointer;position:relative;overflow:hidden;}
.cd:hover:not(.emp):not(.soff){border-color:var(--amber);box-shadow:var(--sh);}
.cd.emp{background:transparent;border-color:transparent;cursor:default;}
.cd.we{background:#fdf6f0;}
.cd.we .dn{color:#c06040;}
.cd.tod{border-color:var(--red);}
.cd.tod .dn{color:var(--red);font-weight:700;}
.cd.soff{background:var(--blue-l);border-color:var(--blue-b);cursor:pointer;}
.cd.soff:hover{background:#d8eaff;}

.dn{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:3px;}
.dn .smk{font-size:9px;background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);border-radius:20px;padding:0 5px;font-family:'Noto Sans TC',sans-serif;font-weight:500;}
.dv{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;}
.dhint{font-size:9px;color:var(--hint);text-align:center;margin-top:8px;}
.soff-lbl{font-size:10px;font-weight:700;color:var(--blue);display:block;margin-top:3px;}
.vhtags{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.vhtag{font-size:9px;padding:1px 4px;border-radius:3px;display:flex;align-items:center;gap:2px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vhdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* Notified checkbox */
.notify-meal-row{display:flex;align-items:center;gap:4px;}
.notify-meal-lbl{font-size:8px;color:#fff;padding:1px 4px;border-radius:3px;flex-shrink:0;}
.notify-row{display:flex;align-items:center;gap:6px;margin-top:5px;}
.ncheck{display:flex;align-items:center;gap:3px;cursor:pointer;}
.notify-box{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
.ncheck:hover .notify-box{border-color:var(--green);}
.notify-box.checked{background:var(--green);border-color:var(--green);}
.notify-box.checked::after{content:'✓';color:#fff;font-size:8px;font-weight:700;line-height:1;}
.notify-lbl{font-size:9px;color:var(--muted);user-select:none;line-height:1;}
.notify-lbl.checked{color:var(--green);font-weight:600;}
.cd.notified{background:#f0faf2 !important;}
.cd.half-notified{background:#fefbee !important;}

/* ─ Overlays & Modals ─ */
.ov{position:fixed;inset:0;background:rgba(30,24,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
.ov.on{opacity:1;pointer-events:all;}
.mo{background:var(--card);border-radius:16px;padding:22px;width:390px;max-width:94vw;max-height:90vh;overflow-y:auto;box-shadow:var(--sh2);transform:translateY(8px);transition:transform .2s;}
.ov.on .mo{transform:translateY(0);}
.hmo{background:var(--card);border-radius:16px;padding:22px;width:560px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);transform:translateY(8px);transition:transform .2s;}
.ov.on .hmo{transform:translateY(0);}
.mo h3,.hmo h3{font-size:16px;margin-bottom:3px;}
.dlbl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:14px;}
.sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.mact{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}

/* Vendor picker */
.vp{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;}
.vpb{padding:9px 12px;border:2px solid var(--border);border-radius:9px;background:var(--card2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:9px;transition:.15s;font-family:inherit;width:100%;}
.vpb:hover:not(.vh){border-color:var(--amber);background:var(--amber-l);}
.vpb.act{border-color:var(--red);background:var(--red-l);}
.vpb.vh{opacity:.35;cursor:not-allowed;}
.vpn{font-size:12px;font-weight:600;}
.vpm{font-size:10px;color:var(--muted);margin-top:1px;}
.hbadge{font-size:10px;color:#a02020;background:#fff0f0;border:1px solid #f5c0c0;border-radius:20px;padding:0 6px;margin-left:4px;}

/* Buttons */
.bghost{padding:7px 14px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bghost:hover{color:var(--text);border-color:var(--text);}
.bdanger{padding:7px 14px;background:#fff0f0;color:var(--red);border:1.5px solid var(--red-b);border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bdanger:hover{background:#ffe0e0;}
.bok{padding:7px 16px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bok:hover{background:#a02c08;}
.bblue{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bblue:hover{background:#083a6e;}

/* ─ Mini calendar (holiday picker) ─ */
.mcwrap{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.mchead{background:var(--card2);padding:9px 13px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--border);}
.mchead .mcht{font-size:13px;font-weight:700;flex:1;}
.mchips{display:flex;flex-wrap:wrap;gap:4px;}
.mchip{font-size:10px;padding:1px 8px;border-radius:20px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;display:flex;align-items:center;gap:3px;}
.mchip button{background:none;border:none;color:#a02020;cursor:pointer;font-size:12px;line-height:1;padding:0;}
.mcb{padding:9px 13px;}
.mchd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
.mcwd{text-align:center;font-size:10px;color:var(--muted);font-weight:600;padding:2px 0;}
.mcwd.we{color:#c06040;}
.mcgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mcd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;cursor:pointer;border:1.5px solid transparent;transition:.12s;font-family:'DM Mono',monospace;font-weight:500;user-select:none;}
.mcd:hover:not(.mce){background:var(--amber-l);border-color:var(--amber);}
.mcd.mce{cursor:default;visibility:hidden;}
.mcd.mcwe{color:#c06040;}
.mcd.mcoff{background:#fff0f0!important;border-color:#f08060!important;color:var(--red)!important;font-weight:700;}
.mcd.mcsoff{background:var(--blue-l)!important;border-color:var(--blue-b)!important;color:var(--blue)!important;font-weight:700;}
.mcd.mcdim{color:var(--hint);cursor:default;}
.mcd.mcdim:hover{background:transparent;border-color:transparent;}

/* Vendor hol section */
.vhsec{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.vhhead{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--card2);border-bottom:1.5px solid var(--border);cursor:pointer;user-select:none;}
.vhhead:hover{background:var(--card3);}
.vhhead .vhhn{font-size:13px;font-weight:700;flex:1;}
.vhcnt{font-size:10px;padding:1px 8px;border-radius:20px;background:#fff0f0;color:#a02020;border:1px solid #f5c0c0;}
.vharrow{color:var(--muted);font-size:12px;transition:transform .2s;}
.vharrow.open{transform:rotate(180deg);}
.vhbody{padding:10px 13px;display:none;}
.vhbody.open{display:block;}

/* Chips row for vendor holidays display */
.vhchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}

/* Pending selection highlight */
.mcd.mcpend{background:#fff8e0!important;border-color:var(--amber)!important;color:var(--amber)!important;font-weight:700;}
.mcd.mcpend-off{background:#fff0f0!important;border-color:#f08060!important;color:var(--red)!important;font-weight:700;}
.vhol-note{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.vhol-pending-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 10px;background:var(--amber-l);border:1.5px solid #e8c070;border-radius:8px;}
.vhol-pending-bar span{font-size:12px;color:var(--amber);font-weight:500;}
.bsave{padding:5px 14px;background:var(--amber);color:#fff;border:none;border-radius:7px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:.15s;}
.bsave:hover{background:#a05800;}
.bcancel-sm{padding:5px 10px;background:none;color:var(--muted);border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;transition:.15s;}
.bcancel-sm:hover{color:var(--text);border-color:var(--text);}

/* Section title */
.secttl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
/* Activity log */
.act-item{font-size:10px;padding:5px 7px;background:var(--card2);border-radius:6px;line-height:1.5;border-left:2px solid var(--border);}
.act-item.schedule{border-left-color:var(--red);}
.act-item.notify{border-left-color:var(--green);}
.act-item.vendor{border-left-color:var(--amber);}
.act-who{font-weight:700;color:var(--text);}
.act-time{color:var(--hint);font-size:9px;}

/* Admin panel */
.admin-panel{position:fixed;inset:0;background:rgba(30,24,16,.6);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.admin-panel.on{opacity:1;pointer-events:all;}
.admin-box{background:var(--card);border-radius:18px;width:680px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(30,24,16,.2);overflow:hidden;}
.admin-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.admin-header h2{font-size:16px;font-weight:700;flex:1;}
.admin-tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--border);flex-shrink:0;}
.atab{padding:7px 16px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;}
.atab.on{color:var(--red);border-bottom-color:var(--red);}
.admin-body{flex:1;overflow-y:auto;padding:18px 20px;}
.admin-login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;}
.admin-login-wrap h3{font-size:16px;}
.admin-login-wrap p{font-size:12px;color:var(--muted);}
.pw-row{display:flex;gap:8px;width:100%;max-width:300px;}

/* Log table */
.log-table{width:100%;border-collapse:collapse;font-size:12px;}
.log-table th{text-align:left;padding:6px 8px;background:var(--card2);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);}
.log-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.log-table tr:last-child td{border-bottom:none;}
.log-badge{font-size:9px;padding:1px 6px;border-radius:20px;font-weight:600;white-space:nowrap;}
.log-badge.schedule{background:var(--red-l);color:var(--red);}
.log-badge.notify{background:var(--green-l);color:var(--green);}
.log-badge.vendor{background:var(--amber-l);color:var(--amber);}

/* Monthly stats */
.mstat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px;}
.mstat-card{background:var(--card2);border-radius:9px;padding:10px 12px;}
.mstat-vname{font-size:11px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mstat-cnt{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--red);}
.mstat-pct{font-size:10px;color:var(--muted);}
.month-picker{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.month-picker button{background:var(--card2);border:1.5px solid var(--border);border-radius:7px;padding:4px 12px;cursor:pointer;font-size:14px;transition:.15s;}
.month-picker button:hover{border-color:var(--red);}

<script type="module">
// ─── State ────────────────────────────────────────────────────────────────────
const SK = 'bentoV4';
const COLORS = ['#c8380a','#c87000','#1e6e30','#0a4a8a','#5a2a8a','#8a2a60','#1a709a','#707020','#2a7060','#7a3030'];

let S = {
  vendors:[
    {id:1, name:'幸福食堂（週六休）',    color:'#c8380a', weight:1, phone:''},
    {id:2, name:'鋒味便當',             color:'#c87000', weight:1, phone:''},
    {id:3, name:'安妞食堂',             color:'#1e6e30', weight:1, phone:''},
    {id:4, name:'八方雲集',             color:'#0a4a8a', weight:1, phone:''},
    {id:5, name:'一家人',               color:'#5a2a8a', weight:1, phone:''},
    {id:6, name:'深海深',               color:'#8a2a60', weight:1, phone:''},
    {id:7, name:'寶媽食堂（週六日休）', color:'#1a709a', weight:1, phone:''},
    {id:8, name:'泰意家',               color:'#707020', weight:1, phone:''},
    {id:9, name:'斗六嘴',               color:'#2a7060', weight:1, phone:''},
    {id:10,name:'陳媽媽火雞肉飯（晚上不送）',color:'#7a3030', weight:1, phone:''},
    {id:11,name:'阿里山便當',           color:'#4a7a20', weight:1, phone:''},
    {id:12,name:'263便當',              color:'#20507a', weight:1, phone:''},
    {id:13,name:'鴨殿鴨肉飯',          color:'#7a5020', weight:1, phone:''},
    {id:14,name:'佳和飯包',             color:'#3a3a8a', weight:1, phone:''},
  ],
  schedule:{},    // 保留舊資料相容
  lunch:{},       // "YYYY-MM-DD" → vendorId (午餐)
  dinner:{},      // "YYYY-MM-DD" → vendorId (晚餐)
  schoolHols:{},  // "YYYY-MM-DD" → true
  vendorHols:{},  // "YYYY-MM-DD" → [vendorId,...]
  notified:{},    // "YYYY-MM-DD_pre/day" → true
  cy:new Date().getFullYear(),
  cm:new Date().getMonth(),
};

// ─── Firebase ─────────────────────────────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnYqfPMeL8uInfnmD-9uKs-Ig_GBFVYvM",
  authDomain: "bento-scheduler-5d638.firebaseapp.com",
  databaseURL: "https://bento-scheduler-5d638-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bento-scheduler-5d638",
  storageBucket: "bento-scheduler-5d638.firebasestorage.app",
  messagingSenderId: "953917676353",
  appId: "1:953917676353:web:8f24e2b49d8364cdbb1fc0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const dbRef = ref(db, 'bentoData');

let saveTimer = null;
function save(){
  // debounce: wait 800ms after last change before writing to Firebase
  clearTimeout(saveTimer);
  setSyncStatus('saving');
  saveTimer = setTimeout(()=>{
    const data = {
      vendors: S.vendors,
      lunch: S.lunch,
      dinner: S.dinner,
      schoolHols: S.schoolHols,
      vendorHols: S.vendorHols,
      notified: S.notified,
      actLog: S.actLog||[],
    };
    set(dbRef, data)
      .then(()=>setSyncStatus('saved'))
      .catch(()=>setSyncStatus('error'));
  }, 800);
}

function setSyncStatus(s){
  const el=document.getElementById('syncStatus'); if(!el) return;
  if(s==='saving'){ el.textContent='⏳ 同步中…'; el.style.color='#c87000'; }
  else if(s==='saved'){ el.textContent='☁️ 已同步'; el.style.color='#1e6e30'; }
  else if(s==='live'){ el.textContent='🟢 即時連線'; el.style.color='#1e6e30'; }
  else if(s==='error'){ el.textContent='❌ 同步失敗'; el.style.color='#c8380a'; }
  else if(s==='loading'){ el.textContent='⏳ 載入中…'; el.style.color='#c87000'; }
}

function migrate(){
  S.vendors.forEach(v=>{ if(!v.weight) v.weight=1; if(v.phone===undefined) v.phone=''; });
  if(!S.notified) S.notified={};
  if(!S.schoolHols) S.schoolHols={};
  if(!S.vendorHols) S.vendorHols={};
  if(!S.schedule) S.schedule={};
  if(!S.lunch) S.lunch={};
  if(!S.dinner) S.dinner={};
  if(!S.actLog) S.actLog=[];
  // 遷移舊 schedule → dinner（你原本排的都是晚餐）
  for(const k in S.schedule){
    if(!S.dinner[k]) S.dinner[k]=S.schedule[k];
  }
  // 把已遷移到 lunch 的也搬到 dinner，然後清空 lunch
  for(const k in S.lunch){
    if(!S.dinner[k]) S.dinner[k]=S.lunch[k];
    delete S.lunch[k];
  }
}

function load(){
  setSyncStatus('loading');
  onValue(dbRef, (snapshot)=>{
    const data = snapshot.val();
    if(data){
      // Preserve current cy/cm (UI state, not synced)
      const cy=S.cy, cm=S.cm;
      S = { ...S, ...data, cy, cm };
    }
    migrate();
    setSyncStatus('live');
    render();
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const dk = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const mdays = (y,m) => new Date(y,m+1,0).getDate();
const fwd = (y,m) => new Date(y,m,1).getDay();
const isWE = (y,m,d) => { const w=new Date(y,m,d).getDay(); return w===0||w===6; };
const isTod = (y,m,d) => { const t=new Date(); return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d; };
const isSchOff = k => !!S.schoolHols[k];
const vholsOn = k => S.vendorHols[k]||[];
const isVOff = (k,vid) => (S.vendorHols[k]||[]).includes(vid);

function getWorkdays(y,m){
  const r=[];
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(!isWE(y,m,d)&&!isSchOff(k)) r.push({d,k});
  }
  return r;
}

function getStats(y,m){
  const lunchCounts={}, dinnerCounts={};
  S.vendors.forEach(v=>{ lunchCounts[v.id]=0; dinnerCounts[v.id]=0; });
  let lunchTotal=0, dinnerTotal=0;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(S.lunch[k]!==undefined){ lunchCounts[S.lunch[k]]=(lunchCounts[S.lunch[k]]||0)+1; lunchTotal++; }
    if(S.dinner[k]!==undefined){ dinnerCounts[S.dinner[k]]=(dinnerCounts[S.dinner[k]]||0)+1; dinnerTotal++; }
  }
  // combined for balance display
  const counts={};
  S.vendors.forEach(v=>counts[v.id]=(lunchCounts[v.id]||0)+(dinnerCounts[v.id]||0));
  const total=lunchTotal+dinnerTotal;
  let schOff=0;
  for(let d=1;d<=mdays(y,m);d++) if(isSchOff(dk(y,m,d))) schOff++;
  return{ counts, lunchCounts, dinnerCounts, total, lunchTotal, dinnerTotal, schOff, workdays:getWorkdays(y,m).length };
}

// ─── Auto Schedule ────────────────────────────────────────────────────────────
function autoSchedule(){
  if(!S.vendors.length){ showToast('請先新增廠商'); return; }
  const y=S.cy, m=S.cm;
  const wdays = getWorkdays(y,m);
  if(!wdays.length){ showToast('本月沒有需訂餐的工作天'); return; }

  // Build weighted pool: each vendor appears weight times per "cycle"
  // We track a "deficit" = (expected count based on weight) - (actual count)
  // Each day, pick the available vendor with the highest deficit
  const assigned={};
  S.vendors.forEach(v=>assigned[v.id]=0);
  const totalWeight = S.vendors.reduce((s,v)=>s+(v.weight||1),0);
  let lastVid=null;

  wdays.forEach(({k}, idx)=>{
    const avail = S.vendors.filter(v=>!isVOff(k,v.id));
    if(!avail.length) return;

    const daysAssigned = idx; // days processed so far
    // deficit = expected_so_far - actual: who is "owed" the most turns
    avail.sort((a,b)=>{
      const wa=(a.weight||1)/totalWeight, wb=(b.weight||1)/totalWeight;
      const defA = wa*daysAssigned - assigned[a.id];
      const defB = wb*daysAssigned - assigned[b.id];
      if(Math.abs(defB-defA)>0.001) return defB-defA; // highest deficit first
      return Math.random()-.5; // shuffle ties
    });
    // Avoid consecutive if possible
    let pick=avail[0];
    if(pick.id===lastVid && avail.length>1) pick=avail[1];
    S.dinner[k]=pick.id;
    assigned[pick.id]++;
    lastVid=pick.id;
  });

  save(); render();
  addLog('schedule', `一鍵自動排班 ${wdays.length} 天`);
  showToast(`✅ 已自動排班 ${wdays.length} 天（依比例分配）`);
}

// ─── Vendor CRUD ──────────────────────────────────────────────────────────────
function addVendor(){
  const el=document.getElementById('newName');
  const name=el.value.trim();
  if(!name){ showToast('請輸入廠商名稱'); return; }
  if(S.vendors.find(v=>v.name===name)){ showToast('廠商名稱已存在'); return; }
  const color=COLORS[S.vendors.length%COLORS.length];
  S.vendors.push({id:Date.now(),name,color,weight:1,phone:''});
  addLog('vendor', `新增廠商「${name}」`);
  el.value=''; save(); render();
}
function removeVendor(id){
  if(!confirm('確定刪除此廠商？已排班的日期也會一併清除。')) return;
  S.vendors=S.vendors.filter(v=>v.id!==id);
  for(const k in S.lunch) if(S.lunch[k]===id) delete S.lunch[k];
  for(const k in S.dinner) if(S.dinner[k]===id) delete S.dinner[k];
  for(const k in S.vendorHols) S.vendorHols[k]=S.vendorHols[k].filter(v=>v!==id);
  save(); render();
}

// ─── School Holiday CRUD ─────────────────────────────────────────────────────
function toggleSchoolHol(k){
  if(S.schoolHols[k]) delete S.schoolHols[k];
  else{ S.schoolHols[k]=true; delete S.lunch[k]; delete S.dinner[k]; }
  save(); render(); renderSchoolModal();
}

// ─── Vendor Holiday CRUD ──────────────────────────────────────────────────────
// pendingVHol: per-vendor staging area  { vendorId: Set<dateKey> }
let pendingVHol = {};

function initPendingForVendor(vid){
  // Copy current saved state into pending set
  const y=S.cy,m=S.cm;
  const set=new Set();
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(isVOff(k,vid)) set.add(k);
  }
  pendingVHol[vid]=set;
}

function togglePendingVHol(k,vid){
  if(!pendingVHol[vid]) initPendingForVendor(vid);
  if(pendingVHol[vid].has(k)) pendingVHol[vid].delete(k);
  else pendingVHol[vid].add(k);
  // Only re-render this vendor's mini-cal + count, not whole modal
  refreshVendorHolSection(vid);
}

function saveVendorHol(vid){
  if(!pendingVHol[vid]) return;
  const y=S.cy,m=S.cm;
  // Clear old data for this vendor this month, write new
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(!S.vendorHols[k]) S.vendorHols[k]=[];
    S.vendorHols[k]=S.vendorHols[k].filter(v=>v!==vid);
    if(pendingVHol[vid].has(k)) S.vendorHols[k].push(vid);
    if(S.vendorHols[k].length===0) delete S.vendorHols[k];
  }
  delete pendingVHol[vid];
  save(); render();
  refreshVendorHolSection(vid);
  showToast('✅ 已儲存公休設定');
}

function cancelVendorHol(vid){
  delete pendingVHol[vid];
  refreshVendorHolSection(vid);
}

function refreshVendorHolSection(vid){
  const v=S.vendors.find(v=>v.id===vid); if(!v) return;
  const y=S.cy,m=S.cm;
  const pending=pendingVHol[vid];
  // Count: use pending if editing, else saved
  let count=0;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(pending? pending.has(k) : isVOff(k,vid)) count++;
  }
  // Update count badge
  const cntEl=document.getElementById(`vhcnt_${vid}`);
  if(cntEl) cntEl.textContent=`${count} 天公休`;
  // Re-render mini cal
  const calDiv=document.getElementById(`vhcal_${vid}`);
  if(calDiv){
    renderMiniCal(null, y, m, k=>{ togglePendingVHol(k,vid); },
      k=>{
        const inPend = pending ? pending.has(k) : false;
        const inSaved = isVOff(k,vid);
        if(pending){
          return inPend ? 'mcpend-off' : '';
        }
        return inSaved ? 'mcoff' : '';
      },
      calDiv, isSchOff);
  }
  // Show/hide pending bar
  const bar=document.getElementById(`vhbar_${vid}`);
  if(bar){
    if(pending){
      bar.style.display='flex';
      const diff=count - (()=>{ let c=0; for(let d=1;d<=mdays(y,m);d++) if(isVOff(dk(y,m,d),vid)) c++; return c; })();
      bar.querySelector('.vhol-pending-bar span').textContent=
        `已選 ${count} 天公休${diff>0?` (+${diff})`:diff<0?` (${diff})`:''}（尚未儲存）`;
    } else {
      bar.style.display='none';
    }
  }
}

function renderDayPicker(){

// ─── Mini Calendar builder ────────────────────────────────────────────────────
// targetId: element id OR null (use el directly)
// onClick: (key)=>void
// cellClass: (key)=>string of extra classes
// el: direct element ref (optional)
// dimFn: (key)=>bool — if true, cell is dimmed (unclickable)
function renderMiniCal(targetId, y, m, onClick, cellClass, el=null, dimFn=null){
  const wrap = el || document.getElementById(targetId);
  if(!wrap) return;
  wrap.innerHTML='';
  const hd=document.createElement('div'); hd.className='mchd';
  ['日','一','二','三','四','五','六'].forEach((w,i)=>{
    const s=document.createElement('div'); s.className='mcwd'+(i===0||i===6?' we':''); s.textContent=w;
    hd.appendChild(s);
  });
  wrap.appendChild(hd);
  const grid=document.createElement('div'); grid.className='mcgrid';
  const first=fwd(y,m), total=mdays(y,m);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='mcd mce';grid.appendChild(e);}
  for(let d=1;d<=total;d++){
    const k=dk(y,m,d);
    const we=isWE(y,m,d);
    const dim=dimFn&&dimFn(k);
    const extra=cellClass(k);
    const cell=document.createElement('div');
    cell.className='mcd'+(we?' mcwe':'')+(dim&&!extra?' mcdim':'')+(extra?' '+extra:'');
    cell.textContent=d;
    if(!dim||extra) cell.onclick=()=>onClick(k);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
}

// ─── Calendar Render ──────────────────────────────────────────────────────────
function renderCalendar(){
  const y=S.cy,m=S.cm;
  const mn=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('monthLabel').textContent=`${y} 年 ${mn[m]} 月`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  const first=fwd(y,m), total=mdays(y,m);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cd emp';grid.appendChild(e);}
  for(let d=1;d<=total;d++){
    const k=dk(y,m,d);
    const we=isWE(y,m,d);
    const soff=isSchOff(k);
    const tod=isTod(y,m,d);
    const lVendor=S.lunch[k]!==undefined?S.vendors.find(v=>v.id===S.lunch[k]):null;
    const dVendor=S.dinner[k]!==undefined?S.vendors.find(v=>v.id===S.dinner[k]):null;
    const hasAny=lVendor||dVendor;
    const vhols=vholsOn(k).map(id=>S.vendors.find(v=>v.id===id)).filter(Boolean);
    const isNotified=!!S.notified[k+'_lunch_pre']||!!S.notified[k+'_lunch_day']||!!S.notified[k+'_dinner_pre']||!!S.notified[k+'_dinner_day'];
    const isFullNotified=((!lVendor||(S.notified[k+'_lunch_pre']&&S.notified[k+'_lunch_day'])))&&((!dVendor||(S.notified[k+'_dinner_pre']&&S.notified[k+'_dinner_day'])))&&hasAny);
    const cell=document.createElement('div');
    let cls='cd'+(we?' we':'')+(soff?' soff':'')+(tod?' tod':'')+(isFullNotified&&hasAny?' notified':isNotified&&hasAny?' half-notified':'');
    cell.className=cls;
    // Day number
    const dn=document.createElement('div'); dn.className='dn';
    dn.textContent=d;
    if(soff){ const mk=document.createElement('span'); mk.className='smk'; mk.textContent='公休'; dn.appendChild(mk); }
    cell.appendChild(dn);
    if(soff){
      const lbl=document.createElement('span'); lbl.className='soff-lbl'; lbl.textContent='補習班公休・不訂餐';
      cell.appendChild(lbl);
    } else {
      // Lunch tag
      if(lVendor){
        const tag=document.createElement('span'); tag.className='meal-tag lunch';
        tag.style.background=lVendor.color;
        tag.textContent='☀️ '+lVendor.name;
        tag.onclick=e=>{ e.stopPropagation(); openDayModal(k,'lunch'); };
        cell.appendChild(tag);
      }
      // Dinner tag
      if(dVendor){
        const tag=document.createElement('span'); tag.className='meal-tag dinner';
        tag.style.background=dVendor.color;
        tag.textContent='🌙 '+dVendor.name;
        tag.onclick=e=>{ e.stopPropagation(); openDayModal(k,'dinner'); };
        cell.appendChild(tag);
      }
      if(!we && !lVendor && !dVendor){
        const h=document.createElement('div'); h.className='dhint'; h.textContent='點擊選擇';
        cell.appendChild(h);
      }
      // Notify checkboxes (only if any meal set)
      if(hasAny){
        const nr=document.createElement('div'); nr.className='notify-row'; nr.style.flexDirection='column'; nr.style.gap='3px';
        const makeRow=(meal,label,vendor)=>{
          if(!vendor) return '';
          const preK=`${k}_${meal}_pre`, dayK=`${k}_${meal}_day`;
          return `<div class="notify-meal-row">
            <span class="notify-meal-lbl" style="background:${vendor.color}">${label}</span>
            <div class="ncheck" data-key="${k}" data-meal="${meal}" data-type="pre">
              <div class="notify-box${S.notified[preK]?' checked':''}"></div>
              <span class="notify-lbl${S.notified[preK]?' checked':''}">提前預約</span>
            </div>
            <div class="ncheck" data-key="${k}" data-meal="${meal}" data-type="day">
              <div class="notify-box${S.notified[dayK]?' checked':''}"></div>
              <span class="notify-lbl${S.notified[dayK]?' checked':''}">當天確認</span>
            </div>
          </div>`;
        };
        nr.innerHTML=makeRow('lunch','☀️',lVendor)+makeRow('dinner','🌙',dVendor);
        nr.querySelectorAll('.ncheck').forEach(nc=>{
          nc.addEventListener('click',e=>{
            e.stopPropagation();
            const meal=nc.dataset.meal, type=nc.dataset.type;
            const nk=`${nc.dataset.key}_${meal}_${type}`;
            const mealLabel=meal==='lunch'?'午餐':'晚餐';
            const typeLabel=type==='pre'?'提前預約':'當天確認';
            const [y,m,d]=nc.dataset.key.split('-').map(Number);
            if(S.notified[nk]){ delete S.notified[nk]; addLog('notify',`取消 ${m}/${d} ${mealLabel}${typeLabel}`); }
            else { S.notified[nk]=true; addLog('notify',`✓ ${m}/${d} ${mealLabel}${typeLabel}`); }
            save(); renderCalendar(); renderActLog();
          });
        });
        cell.appendChild(nr);
      }
      // Vendor holiday tags
      if(vhols.length){
        const tags=document.createElement('div'); tags.className='vhtags';
        vhols.forEach(v=>{
          const t=document.createElement('div'); t.className='vhtag';
          t.innerHTML=`<span class="vhdot" style="background:${v.color}"></span>${v.name}公休`;
          tags.appendChild(t);
        });
        cell.appendChild(tags);
      }
    }
    cell.onclick=()=>{
      if(soff){ if(confirm('這天是補習班公休，要取消公休嗎？')){ toggleSchoolHol(k); } return; }
      openDayModal(k,'dinner');
    };
    grid.appendChild(cell);
  }
}

// ─── Edit vendor (inline: name + phone) ──────────────────────────────────────
function startRename(id){
  const v=S.vendors.find(v=>v.id===id); if(!v) return;
  const row=document.getElementById(`vi_${id}`); if(!row) return;
  row.classList.add('editing');

  // Replace name span with input
  const nameEl=document.getElementById(`vn_${id}`);
  if(!nameEl){ showToast('找不到名稱欄位，請重新整理'); return; }
  const nameInp=document.createElement('input');
  nameInp.type='text'; nameInp.className='vname-inp'; nameInp.value=v.name;
  nameInp.maxLength=20; nameInp.id=`vinp_${id}`; nameInp.placeholder='廠商名稱';
  nameEl.replaceWith(nameInp);

  // Replace phone row with edit form
  const phRow=document.getElementById(`vph_${id}`);
  if(!phRow){
    // phone row not found — append form to row directly
    const form=document.createElement('div'); form.className='vi-editform';
    form.id=`veditform_${id}`;
    form.innerHTML=`
      <div class="vi-editrow">
        <span class="vi-editlbl">電話</span>
        <input type="tel" class="vname-inp" id="vtel_${id}" value="${v.phone||''}" placeholder="例：02-12345678" maxlength="25">
      </div>
      <div class="vi-editrow" style="justify-content:flex-end;gap:5px;margin-top:2px">
        <button class="bcancel-sm" onclick="cancelRename(${id})">取消</button>
        <button class="bsave" onclick="confirmRename(${id})">✓ 儲存</button>
      </div>`;
    row.appendChild(form);
  } else {
    const form=document.createElement('div'); form.className='vi-editform';
    form.id=`veditform_${id}`;
    form.innerHTML=`
      <div class="vi-editrow">
        <span class="vi-editlbl">電話</span>
        <input type="tel" class="vname-inp" id="vtel_${id}" value="${v.phone||''}" placeholder="例：02-12345678" maxlength="25">
      </div>
      <div class="vi-editrow" style="justify-content:flex-end;gap:5px;margin-top:2px">
        <button class="bcancel-sm" onclick="cancelRename(${id})">取消</button>
        <button class="bsave" onclick="confirmRename(${id})">✓ 儲存</button>
      </div>`;
    phRow.replaceWith(form);
  }

  // Hide edit button while editing
  const editBtn=row.querySelector('.ico.edit');
  if(editBtn) editBtn.style.visibility='hidden';

  nameInp.focus(); nameInp.select();
  const onKey=id=>(e=>{ if(e.key==='Enter') confirmRename(id); if(e.key==='Escape') cancelRename(id); });
  nameInp.addEventListener('keydown', onKey(id));
  setTimeout(()=>{
    const telInp=document.getElementById(`vtel_${id}`);
    if(telInp) telInp.addEventListener('keydown', onKey(id));
  }, 50);
}

function confirmRename(id){
  const nameInp=document.getElementById(`vinp_${id}`); if(!nameInp) return;
  const telInp=document.getElementById(`vtel_${id}`);
  const newName=nameInp.value.trim();
  if(!newName){ showToast('名稱不能為空'); nameInp.focus(); return; }
  if(S.vendors.find(v=>v.id!==id&&v.name===newName)){ showToast('名稱已存在'); nameInp.focus(); return; }
  const v=S.vendors.find(v=>v.id===id); if(!v) return;
  v.name=newName;
  v.phone=telInp?telInp.value.trim():'';
  save(); render();
  showToast(`已更新「${newName}」`);
}

function cancelRename(id){ render(); }

function setWeight(id, delta){
  const v=S.vendors.find(v=>v.id===id); if(!v) return;
  v.weight=Math.max(1, Math.min(5, (v.weight||1)+delta));
  save(); renderSidebar();

function switchTab(name){
  ['log','stats'].forEach(t=>{
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).style.display=t===name?'block':'none';
  });
  document.querySelectorAll('.atab').forEach((btn,i)=>{

function renderLogTable(){
  const tbody=document.getElementById('logTableBody'); if(!tbody) return;

  if(!logs.length){ tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">還沒有紀錄</td></tr>'; return; }

    <tr>

      <td style="font-weight:600">${a.who||'未知'}</td>

      <td>${a.msg||''}</td>

}

function renderStatsTab(){

  document.getElementById('statsMonthLbl').textContent=`${y}年${mn[m]}月`;
  const con=document.getElementById('statsContent'); if(!con) return;
  const {lunchCounts,dinnerCounts,total,schOff,workdays}=getStats(y,m);
  const wn=['日','一','二','三','四','五','六'];
  let html=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
    <div class="sc"><div class="sn">${total}</div><div class="sl">已排總次數</div></div>
    <div class="sc"><div class="sn">${workdays}</div><div class="sl">需訂餐天數</div></div>
    <div class="sc"><div class="sn">${schOff}</div><div class="sl">補習班公休</div></div>
    <div class="sc"><div class="sn">${workdays>0?Math.round(total/(workdays*2)*100):'0'}%</div><div class="sl">排班完成率</div></div>
  </div>`;
  html+=`<div class="sb-ttl" style="margin-bottom:8px;">廠商訂購明細</div><div class="mstat-grid">`;
  S.vendors.forEach(v=>{
    const l=lunchCounts[v.id]||0, d2=dinnerCounts[v.id]||0;
    if(l+d2===0) return;
    html+=`<div class="mstat-card">
      <div class="mstat-vname" title="${v.name}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${v.color};margin-right:4px;"></span>${v.name}</div>
      <div class="mstat-cnt">${l+d2}</div>
      <div class="mstat-pct">☀️${l} 🌙${d2}</div></div>`;
  });
  html+=`</div>`;
  html+=`<div class="sb-ttl" style="margin-bottom:8px;margin-top:12px;">每日排班明細</div>
    <table class="log-table"><thead><tr><th>日期</th><th>☀️ 午餐</th><th>🌙 晚餐</th><th>午預約</th><th>午確認</th><th>晚預約</th><th>晚確認</th></tr></thead><tbody>`;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    if(isWE(y,m,d)) continue;
    if(isSchOff(k)){ html+=`<tr><td>${m+1}/${d}（${wn[new Date(y,m,d).getDay()]}）</td><td colspan="6" style="color:var(--blue);font-size:11px">🏫 補習班公休</td></tr>`; continue; }
    const lv=S.lunch[k]!==undefined?S.vendors.find(vv=>vv.id===S.lunch[k]):null;
    const dv=S.dinner[k]!==undefined?S.vendors.find(vv=>vv.id===S.dinner[k]):null;
    const mkTag=v=>v?`<span style="background:${v.color};color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;">${v.name}</span>`:'<span style="color:var(--hint)">—</span>';
    const chk=key=>S.notified[key]?'✅':'—';
    html+=`<tr><td>${m+1}/${d}（${wn[new Date(y,m,d).getDay()]}）</td>
      <td>${mkTag(lv)}</td><td>${mkTag(dv)}</td>
      <td style="text-align:center">${chk(k+'_lunch_pre')}</td>
      <td style="text-align:center">${chk(k+'_lunch_day')}</td>
      <td style="text-align:center">${chk(k+'_dinner_pre')}</td>
      <td style="text-align:center">${chk(k+'_dinner_day')}</td></tr>`;
  }
  html+=`</tbody></table>`;
  con.innerHTML=html;
}

function addLog(type, msg){
  if(!S.actLog) S.actLog=[];
  const now=new Date();
  const time=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  S.actLog.unshift({ type, msg, who:currentUser, time });
  if(S.actLog.length>50) S.actLog=S.actLog.slice(0,50); // 只保留最近50筆
}

function renderActLog(){
  const el=document.getElementById('actLog'); if(!el) return;

// ─── Clear ────────────────────────────────────────────────────────────────────
function clearMonth(){
  if(!confirm('確定清除本月所有排班？')) return;
  const y=S.cy,m=S.cm;
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);

  }

// ─── Export ───────────────────────────────────────────────────────────────────
function exportSchedule(){
  const y=S.cy,m=S.cm;
  const wn=['日','一','二','三','四','五','六'];
  const mn=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  const lines=[`📅 ${y}年${mn[m]}月 便當排班表\n`];
  for(let d=1;d<=mdays(y,m);d++){
    const k=dk(y,m,d);
    const w=new Date(y,m,d).getDay();
    if(isSchOff(k)){ lines.push(`${m+1}/${d}（${wn[w]}）🏫 補習班公休`); continue; }
    if(isWE(y,m,d)) continue;
    const lv=S.lunch[k]!==undefined?S.vendors.find(vv=>vv.id===S.lunch[k]):null;
    const dv=S.dinner[k]!==undefined?S.vendors.find(vv=>vv.id===S.dinner[k]):null;
    if(lv||dv){
      let line=`${m+1}/${d}（${wn[w]}）`;
      if(lv) line+=`☀️${lv.name}`;
      if(lv&&dv) line+=' ';
      if(dv) line+=`🌙${dv.name}`;
      lines.push(line);
    } else {
      lines.push(`${m+1}/${d}（${wn[w]}）－ 尚未排班`);
    }
  }
  const {lunchCounts,dinnerCounts}=getStats(y,m);
  lines.push('\n📊 廠商訂購統計：');
  S.vendors.forEach(v=>{
    const l=lunchCounts[v.id]||0, d2=dinnerCounts[v.id]||0;
    if(l+d2>0) lines.push(`  ${v.name}：午餐${l}天・晚餐${d2}天`);
  });
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>showToast('📋 已複製到剪貼簿！'))
    .catch(()=>showToast('複製失敗，請手動截圖'));
}

// ─── Backup / Restore ─────────────────────────────────────────────────────────
function backupData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const now=new Date();
  const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  a.href=url; a.download=`便當安排備份_${stamp}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('💾 備份檔已下載');
}

function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(!parsed.vendors) throw new Error('格式錯誤');
      if(!confirm(`確定要匯入備份？\n目前的資料將會被覆蓋。`)) return;
      S={...S,...parsed};
      migrate();
      save(); render();
      showToast('✅ 資料匯入成功！');
    }catch(err){
      showToast('❌ 匯入失敗，請確認是正確的備份檔');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}
